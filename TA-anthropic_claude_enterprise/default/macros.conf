[claude_index]
definition = index=*
iseval = 0

[claude_signin_filter]
definition = (event_type=user_signed_in* OR event_type=*login* OR event_type=*logged_in* OR event_type=user_authenticated* OR event_type=*signin*)
iseval = 0

[claude_admin_filter]
definition = event_type IN ("org_sso_toggled","org_sso_add_initiated","org_sso_connection_activated","org_sso_connection_deactivated","org_sso_connection_deleted","org_jit_toggled","org_domain_add_initiated","org_domain_verified","org_user_deleted")
iseval = 0

[claude_export_filter]
definition = event_type IN ("org_data_export_started","org_data_export_completed")
iseval = 0

[claude_invite_filter]
definition = event_type IN ("org_user_invite_sent","org_user_invite_accepted","org_user_invite_rejected","org_user_invite_deleted","org_user_invite_re_sent")
iseval = 0

[claude_project_filter]
definition = event_type IN ("project_created","project_deleted","project_renamed","project_visibility_changed","project_document_created","project_document_deleted","conversation_renamed","conversation_deleted","claude_chat_created","conversation_created")
iseval = 0

[claude_file_filter]
definition = event_type="file_uploaded"
iseval = 0

[claude_actor_email]
definition = eval actor_email=coalesce(actor_email, entity_email, target_email)
iseval = 0
