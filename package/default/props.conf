# Sourcetype definitions for AI Governance Add-on for Splunk.
# All events are JSON written by modular inputs with explicit timestamps.

[aigov:anthropic:activity]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 999999
KV_MODE = json
TIME_PREFIX = "created_at"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Security
description = Anthropic Claude Enterprise compliance activity feed events

